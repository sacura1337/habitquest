# Конфигурация Alembic — инструмента миграций базы данных HabitQuest.
#
# Расположение миграций и каталог запуска.
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Строка подключения по умолчанию.
# Рабочее значение берётся из переменной окружения DATABASE_URL
# (см. backend/app/core/config.py и backend/.env.example),
# поэтому менять эту строку для смены базы данных не нужно.
sqlalchemy.url = sqlite:///./habitquest.db

# Настройки журналирования Alembic.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
